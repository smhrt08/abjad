function scoreWord(word, roots) {
  const upper = word.toUpperCase();
  if (upper.length < 5) return { valid: false, reason: "5 letter minimum" };
  const matched = roots.filter(r => upper.includes(r));
  if (matched.length < 2) return { valid: false, reason: "Use at least 2 root letters" };
  const mult = matched.length === 3 ? 3 : 1.5;
  return { valid: true, matched, score: Math.round(upper.length * mult), rootsHit: matched.length, allThree: matched.length === 3 };
}

function buildRankedList(roots, wordList) {
  const all = [];
  wordList.forEach(word => {
    const matched = roots.filter(r => word.includes(r));
    if (matched.length < 2) return;
    const mult = matched.length === 3 ? 3 : 1.5;
    all.push({ word, score: Math.round(word.length * mult), matched, rootsHit: matched.length, allThree: matched.length === 3 });
  });
  all.sort((a, b) => b.score - a.score || b.word.length - a.word.length);
  return all;
}

function dedupeByLength(ranked, maxItems) {
  const seen = new Set();
  const result = [];
  for (const entry of ranked) {
    if (result.length >= maxItems) break;
    if (!seen.has(entry.word.length)) {
      seen.add(entry.word.length);
      result.push(entry);
    }
  }
  return result;
}

function RootLetters({ roots, matchedRoots }) {
  return (
    <div style={{ display: "flex", gap: 24, justifyContent: "center" }}>
      {roots.map((letter, i) => {
        const isMatched = matchedRoots.includes(letter);
        return (
          <div key={i} style={{
            width: 54, height: 62, display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 30, fontWeight: 700, fontFamily: MONO,
            color: isMatched ? BG : ACCENT,
            backgroundColor: isMatched ? ACCENT : "transparent",
            borderBottom: isMatched ? `2px solid ${ACCENT}` : "2px solid rgba(92,189,185,0.3)",
            transition: "all 0.25s ease",
          }}>{letter}</div>
        );
      })}
    </div>
  );
}

function Timer({ seconds, total }) {
  const pct = seconds / total;
  const urgent = seconds <= 10;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, justifyContent: "center" }}>
      <div style={{ width: 120, height: 2, backgroundColor: "rgba(255,255,255,0.08)", overflow: "hidden" }}>
        <div style={{ width: `${pct * 100}%`, height: "100%", backgroundColor: urgent ? "#b55" : TEXT_DIM, transition: "width 1s linear, background-color 0.5s ease" }} />
      </div>
      <span style={{ fontSize: 14, fontVariantNumeric: "tabular-nums", fontFamily: MONO, color: urgent ? "#b55" : TEXT_FAINT }}>{seconds}</span>
    </div>
  );
}

function WordDisplay({ word, roots }) {
  if (!word) {
    return (
      <div style={{ height: 56, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ width: 2, height: 28, backgroundColor: TEXT_FAINT, animation: "blink 1s step-end infinite" }} />
      </div>
    );
  }
  return (
    <div style={{ height: 56, display: "flex", alignItems: "center", justifyContent: "center", gap: 1 }}>
      {word.toUpperCase().split("").map((char, i) => (
        <span key={`${i}-${char}-${word.length}`} style={{
          fontSize: 34, fontWeight: 700, fontFamily: MONO,
          color: roots.includes(char) ? ACCENT : TEXT_DIM,
          letterSpacing: 4, animation: "letterIn 0.12s ease-out forwards", display: "inline-block",

      ))}
      <div style={{ width: 2, height: 28, backgroundColor: TEXT, marginLeft: 2, animation: "blink 1s step-end infinite" }} />

}

function Keyboard({ onKey, onDelete, onSubmit, roots, disabled }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6, alignItems: "center", width: "100%", maxWidth: 480, margin: "0 auto" }}>
      {KEYBOARD_ROWS.map((row, ri) => (
        <div key={ri} style={{ display: "flex", gap: 4, justifyContent: "center", width: "100%" }}>
          {ri === 2 && <button onClick={onSubmit} disabled={disabled} style={{
            flex: "0 0 auto", width: 50, height: 42, borderRadius: 5,
            backgroundColor: disabled ? "#333" : TEXT, color: disabled ? TEXT_FAINT : BG,
            fontSize: 10, fontWeight: 700, fontFamily: MONO, cursor: disabled ? "default" : "pointer",
          }}>{String.fromCharCode(8629)}</button>}
          {row.map(key => {
            const isRoot = roots.includes(key);
            return <button key={key} onClick={() => onKey(key)} disabled={disabled} style={{
              flex: "1 1 0", maxWidth: 36, height: 42, borderRadius: 5,
              border: "1px solid rgba(255,255,255,0.04)",
              backgroundColor: disabled ? "#2a2a2a" : isRoot ? "#2a4a49" : KEY_BG,

}

function Feedback({ message, type }) {
  if (!message) return null;
  const colors = { error: "#b55", success: TEXT_DIM, info: TEXT_FAINT };
  return <div style={{ fontSize: 13, color: colors[type] || TEXT_FAINT, fontFamily: MONO, textAlign: "center", height: 18, fontStyle: "italic" }}>{message}</div>;
}

function ResultsScreen({ puzzle, playerResult, timeUsed, onNextPuzzle, puzzleIndex, totalPuzzles }) {
  const fullRanked = useMemo(() => buildRankedList(puzzle.roots, puzzle.words), [puzzle]);
  const totalWords = puzzle.totalWords;
  const maxScore = fullRanked.length > 0 ? fullRanked[0].score : 0;

  let playerRank = null;
  if (playerResult) {
    playerRank = fullRanked.findIndex(e => e.word === playerResult.word) + 1;
    if (playerRank === 0) playerRank = null;
  }

  const deduped = useMemo(() => {
    const display = dedupeByLength(fullRanked, 12);
    return display.map(e => ({
      ...e,
      rank: fullRanked.indexOf(e) + 1,
      isPlayer: playerResult && e.word === playerResult.word,
    }));
  }, [fullRanked, playerResult]);

  const playerInList = playerResult && deduped.some(e => e.isPlayer);
  let playerEntry = null;
  if (playerResult && !playerInList && playerRank) {
    const found = fullRanked[playerRank - 1];
    if (found) playerEntry = { ...found, rank: playerRank, isPlayer: true };
  }

  const pctScore = playerResult ? Math.round((playerResult.score / maxScore) * 100) : 0;
  const diffColors = { easy: "#5ca87a", medium: "#c4a04e", hard: "#c45a3c" };

  const renderRow = (entry, isP) => {
    const barW = maxScore > 0 ? (entry.score / maxScore) * 100 : 0;
    return (
      <div style={{ display: "flex", alignItems: "center", padding: "6px 24px", backgroundColor: isP ? SURFACE : "transparent", borderLeft: isP ? `2px solid ${ACCENT}` : "2px solid transparent" }}>
        <div style={{ width: 36, fontSize: 13, fontVariantNumeric: "tabular-nums", color: isP ? ACCENT : TEXT_FAINT, fontWeight: 500, flexShrink: 0, textAlign: "right", paddingRight: 10 }}>{entry.rank}</div>
        <div style={{ flex: 1, fontSize: 18, fontWeight: isP ? 700 : 400, letterSpacing: 1, minWidth: 0, overflow: "hidden" }}>
          {entry.word.split("").map((c, ci) => (
            <span key={ci} style={{ color: isP ? (puzzle.roots.includes(c) ? ACCENT : TEXT) : (puzzle.roots.includes(c) ? "rgba(92,189,185,0.5)" : TEXT_DIM) }}>{c}</span>
          ))}
        </div>
        <div style={{ fontSize: 10, color: entry.allThree ? "rgba(92,189,185,0.5)" : "rgba(255,255,255,0.2)", width: 24, textAlign: "center", flexShrink: 0 }}>{entry.rootsHit}/3</div>
        <div style={{ width: 36, display: "flex", alignItems: "center", flexShrink: 0, marginLeft: 2 }}>
          <div style={{ flex: 1, height: 3, backgroundColor: "rgba(255,255,255,0.06)", borderRadius: 1, overflow: "hidden" }}>
            <div style={{ width: `${barW}%`, height: "100%", backgroundColor: isP ? ACCENT : "rgba(255,255,255,0.15)", borderRadius: 1 }} />
          </div>
        </div>
        <div style={{ width: 32, textAlign: "right", fontSize: 14, fontWeight: 600, color: isP ? ACCENT : TEXT_FAINT, flexShrink: 0 }}>{entry.score}</div>
      </div>
    );
  };

  return (
    <div style={{ width: "100%", height: "100vh", backgroundColor: BG, display: "flex", flexDirection: "column", overflow: "hidden", fontFamily: MONO }}>
      <style>{`
        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button { outline: none; } button:active { transform: scale(0.97); }
      `}</style>
      <div style={{ padding: "20px 24px 12px", textAlign: "center", borderBottom: `1px solid ${BORDER}` }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 12, marginBottom: 10 }}>
          <span style={{ fontSize: 18, fontWeight: 700, color: TEXT_DIM, letterSpacing: 8 }}>ABJAD</span>
          <span style={{ fontSize: 10, color: diffColors[puzzle.difficulty], textTransform: "uppercase", letterSpacing: 2, padding: "2px 8px", border: `1px solid ${diffColors[puzzle.difficulty]}`, borderRadius: 3 }}>{puzzle.difficulty}</span>
        </div>
        <div style={{ display: "flex", gap: 20, justifyContent: "center", marginBottom: 8 }}>
          {puzzle.roots.map((l, i) => <span key={i} style={{ fontSize: 22, fontWeight: 700, color: ACCENT }}>{l}</span>)}
        </div>
        <div style={{ fontSize: 11, color: TEXT_FAINT }}>{totalWords.toLocaleString()} possible words</div>
      </div>

      {playerResult ? (
        <div style={{ padding: "14px 24px", borderBottom: `1px solid ${BORDER}`, animation: "fadeUp 0.3s ease forwards" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
            <div>
              <div style={{ fontSize: 9, color: TEXT_FAINT, textTransform: "uppercase", letterSpacing: 2, marginBottom: 5 }}>Your word</div>
              <div style={{ fontSize: 22, fontWeight: 700, letterSpacing: 3 }}>
                {playerResult.word.split("").map((c, i) => (
                  <span key={i} style={{ color: puzzle.roots.includes(c) ? ACCENT : TEXT }}>{c}</span>
                ))}
              </div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 28, fontWeight: 300, color: TEXT, lineHeight: 1 }}>{playerResult.score}</div>
              <div style={{ fontSize: 10, color: TEXT_FAINT, marginTop: 4 }}>
                {playerResult.allThree ? "3/3" : `${playerResult.rootsHit}/3`}{playerRank ? ` \u00b7 #${playerRank}` : ""}{timeUsed !== null ? ` \u00b7 ${timeUsed}s` : ""}
              </div>
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ flex: 1, height: 4, backgroundColor: "rgba(255,255,255,0.06)", borderRadius: 2, overflow: "hidden" }}>
              <div style={{ width: `${pctScore}%`, height: "100%", backgroundColor: ACCENT, borderRadius: 2, transition: "width 0.6s ease" }} />
            </div>
            <span style={{ fontSize: 11, fontWeight: 600, color: ACCENT, minWidth: 36, textAlign: "right" }}>{pctScore}%</span>
          </div>
          <div style={{ fontSize: 9, color: TEXT_FAINT, marginTop: 3 }}>{pctScore}% of max possible ({maxScore} pts)</div>
        </div>
      ) : (
        <div style={{ padding: "16px 24px", textAlign: "center", borderBottom: `1px solid ${BORDER}` }}>
          <div style={{ fontSize: 14, color: TEXT_DIM, fontStyle: "italic" }}>Time up</div>
        </div>
      )}

      <div style={{ flex: 1, overflowY: "auto", padding: "4px 0" }}>
        <div style={{ padding: "8px 24px 6px", fontSize: 9, color: TEXT_FAINT, textTransform: "uppercase", letterSpacing: 2 }}>Best word per length</div>
        {deduped.map(entry => <div key={entry.word}>{renderRow(entry, entry.isPlayer)}</div>)}
        {playerEntry && (
          <div>
            <div style={{ padding: "6px 24px", textAlign: "center", fontSize: 12, color: TEXT_FAINT, letterSpacing: 6 }}>...</div>
            {renderRow(playerEntry, true)}
          </div>
        )}
      </div>
      <div style={{ padding: "12px 24px 28px", borderTop: `1px solid ${BORDER}`, display: "flex", gap: 10, justifyContent: "center", alignItems: "center" }}>
        <span style={{ fontSize: 10, color: TEXT_FAINT }}>{puzzleIndex + 1}/{totalPuzzles}</span>
        <button onClick={onNextPuzzle} style={{ padding: "10px 22px", borderRadius: 5, border: "none", backgroundColor: ACCENT, color: BG, fontSize: 13, fontWeight: 600, fontFamily: MONO, cursor: "pointer" }}>Next Puzzle</button>
      </div>
    </div>
  );
}

function Abjad() {
  const [puzzleIndex, setPuzzleIndex] = useState(0);
  const [gameState, setGameState] = useState("ready");
  const [hasSeenRules, setHasSeenRules] = useState(() => {
    try { return localStorage.getItem("abjad-seen-rules") === "1"; } catch(e) { return false; }
  });
  const [word, setWord] = useState("");
  const [seconds, setSeconds] = useState(GAME_TIME);
  const [feedback, setFeedback] = useState({ message: "", type: "info" });
  const [finalResult, setFinalResult] = useState(null);
  const [timeUsed, setTimeUsed] = useState(null);
  const timerRef = useRef(null);

  const puzzle = PUZZLE_DATA[puzzleIndex];
  const roots = puzzle.roots;
  const wordSet = useMemo(() => new Set(puzzle.words), [puzzle]);
  const matchedRoots = roots.filter(r => word.toUpperCase().includes(r));
  const diffColors = { easy: "#5ca87a", medium: "#c4a04e", hard: "#c45a3c" };

  const endGame = useCallback((result, elapsed) => { clearInterval(timerRef.current); setFinalResult(result); setTimeUsed(elapsed); setGameState("ended"); }, []);
  const showRules = useCallback(() => { setGameState("rules"); }, []);
  const startGame = useCallback(() => { setGameState("playing"); setWord(""); setSeconds(GAME_TIME); setFinalResult(null); setTimeUsed(null); setFeedback({ message: "", type: "info" }); if (!hasSeenRules) { setHasSeenRules(true); try { localStorage.setItem("abjad-seen-rules", "1"); } catch(e) {} } }, [hasSeenRules]);
  const nextPuzzle = useCallback(() => { setPuzzleIndex(i => (i + 1) % PUZZLE_DATA.length); setGameState("ready"); setWord(""); setSeconds(GAME_TIME); setFinalResult(null); setTimeUsed(null); setFeedback({ message: "", type: "info" }); }, []);

  useEffect(() => {
    if (gameState !== "playing") return;
    timerRef.current = setInterval(() => { setSeconds(p => { if (p <= 1) { clearInterval(timerRef.current); endGame(null, GAME_TIME); return 0; } return p - 1; }); }, 1000);
    return () => clearInterval(timerRef.current);
  }, [gameState, endGame]);

  const handleSubmit = useCallback(() => {
    if (gameState !== "playing" || !word) return;
    const upper = word.toUpperCase();
    if (upper.length < 5) { setFeedback({ message: "5 letter minimum", type: "error" }); return; }
    if (!wordSet.has(upper)) {
      const matched = roots.filter(r => upper.includes(r));
      if (matched.length < 2) setFeedback({ message: "Use at least 2 root letters", type: "error" });
      else setFeedback({ message: "Not a valid word", type: "error" });
      return;
    }
    const result = scoreWord(upper, roots);
    if (!result.valid) { setFeedback({ message: result.reason, type: "error" }); return; }
    endGame({ word: upper, matched: result.matched, score: result.score, rootsHit: result.rootsHit, allThree: result.allThree }, GAME_TIME - seconds);
  }, [gameState, word, seconds, roots, wordSet, endGame]);

  useEffect(() => {
    function handleKeyDown(e) {
      if (gameState === "ready" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); if (hasSeenRules) startGame(); else showRules(); return; }
      if (gameState === "rules" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); startGame(); return; }
      if (gameState !== "playing") return;
      if (e.key === "Backspace") { setWord(p => p.slice(0, -1)); setFeedback({ message: "", type: "info" }); }
      else if (e.key === "Enter") handleSubmit();
      else if (/^[a-zA-Z]$/.test(e.key)) { setWord(p => p.length >= 12 ? p : p + e.key.toUpperCase()); setFeedback({ message: "", type: "info" }); }
    }
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [gameState, word, startGame, handleSubmit]);

  const handleKey = (key) => { if (gameState === "ready") { startGame(); setTimeout(() => setWord(key), 50); return; } if (gameState !== "playing" || word.length >= 12) return; setWord(p => p + key); setFeedback({ message: "", type: "info" }); };
  const handleDelete = () => { if (gameState !== "playing") return; setWord(p => p.slice(0, -1)); setFeedback({ message: "", type: "info" }); };

  if (gameState === "rules") return (
    <div style={{ width: "100%", height: "100vh", backgroundColor: BG, display: "flex", flexDirection: "column", overflow: "hidden", userSelect: "none", fontFamily: MONO }}>
      <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "20px 32px", gap: 24 }}>
        <div style={{ fontSize: 28, fontWeight: 700, color: TEXT, letterSpacing: 14 }}>ABJAD</div>
        <div style={{ fontSize: 11, color: TEXT_FAINT, textTransform: "uppercase", letterSpacing: 3 }}>How to play</div>
        <div style={{ maxWidth: 340, width: "100%", display: "flex", flexDirection: "column", gap: 16 }}>
          <div style={{ padding: "14px 16px", backgroundColor: SURFACE, borderRadius: 6, borderLeft: "2px solid " + ACCENT }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: TEXT, marginBottom: 6 }}>Find one word</div>
            <div style={{ fontSize: 12, color: TEXT_DIM, lineHeight: 1.5 }}>You have 60 seconds to think of the longest word that contains at least 2 of the 3 root letters.</div>
          </div>
          <div style={{ padding: "14px 16px", backgroundColor: SURFACE, borderRadius: 6, borderLeft: "2px solid " + ACCENT }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: TEXT, marginBottom: 6 }}>Word length</div>
            <div style={{ fontSize: 12, color: TEXT_DIM, lineHeight: 1.5 }}>Words must be 5-12 letters. Longer words score higher.</div>
          </div>
          <div style={{ padding: "14px 16px", backgroundColor: SURFACE, borderRadius: 6, borderLeft: "2px solid " + ACCENT }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: TEXT, marginBottom: 6 }}>Scoring</div>
            <div style={{ fontSize: 12, color: TEXT_DIM, lineHeight: 1.5 }}>
              <span style={{ color: ACCENT }}>3 of 3</span> roots = word length \u00d7 3<br/>
              <span style={{ color: TEXT }}>2 of 3</span> roots = word length \u00d7 1.5
            </div>
            <div style={{ fontSize: 11, color: TEXT_FAINT, marginTop: 8, lineHeight: 1.5 }}>
              Example: SKELETON with all 3 roots<br/>
              8 letters \u00d7 3 = <span style={{ color: ACCENT }}>24 pts</span>
            </div>
          </div>
        </div>
        <button onClick={startGame} style={{ padding: "12px 40px", borderRadius: 5, backgroundColor: ACCENT, color: BG, fontSize: 14, fontWeight: 700, fontFamily: MONO, cursor: "pointer", letterSpacing: 2, textTransform: "uppercase", marginTop: 8 }}>Play</button>
      </div>
    </div>
  );

  if (gameState === "ended") return <ResultsScreen puzzle={puzzle} playerResult={finalResult} timeUsed={timeUsed} onNextPuzzle={nextPuzzle} puzzleIndex={puzzleIndex} totalPuzzles={PUZZLE_DATA.length} />;

  return (
    <div style={{ width: "100%", height: "100vh", backgroundColor: BG, display: "flex", flexDirection: "column", overflow: "hidden", userSelect: "none", fontFamily: MONO }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap');
        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
        @keyframes letterIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button { outline: none; } button:active { transform: scale(0.97); }
      `}</style>
      <div style={{ flex: "1 1 55%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "20px 24px 0", gap: 20 }}>
        {gameState === "ready" && (
          <>
            <div style={{ fontSize: 28, fontWeight: 700, color: TEXT, letterSpacing: 14 }}>ABJAD</div>
            <div style={{ textAlign: "center", animation: "fadeUp 0.4s ease forwards" }}>
              <div style={{ marginBottom: 8 }}>
                <span style={{ fontSize: 10, color: diffColors[puzzle.difficulty], textTransform: "uppercase", letterSpacing: 2, padding: "2px 8px", border: `1px solid ${diffColors[puzzle.difficulty]}`, borderRadius: 3 }}>{puzzle.difficulty}</span>
              </div>
              <div style={{ marginBottom: 16 }}>
                <button onClick={hasSeenRules ? startGame : showRules} style={{ padding: "11px 34px", borderRadius: 5, backgroundColor: TEXT, color: BG, fontSize: 13, fontWeight: 700, fontFamily: MONO, cursor: "pointer", letterSpacing: 2, textTransform: "uppercase" }}>Start</button>
              </div>
              <div style={{ fontSize: 13, color: TEXT_FAINT, fontStyle: "italic" }}>One word. Sixty seconds.</div>
              <div style={{ fontSize: 10, color: TEXT_FAINT, marginTop: 8 }}>{puzzleIndex + 1} of {PUZZLE_DATA.length}</div>
            </div>
          </>
        )}
        {gameState === "playing" && <Timer seconds={seconds} total={GAME_TIME} />}
        {gameState === "playing" && <RootLetters roots={roots} matchedRoots={matchedRoots} />}
        {gameState === "playing" && (
          <>
            <WordDisplay word={word} roots={roots} />
            <Feedback message={feedback.message} type={feedback.type} />
          </>
        )}
      </div>
      <div style={{ flex: "0 0 auto", padding: "10px 8px 24px", borderTop: `1px solid ${BORDER}` }}>
        <Keyboard onKey={handleKey} onDelete={handleDelete} onSubmit={handleSubmit} roots={roots} disabled={gameState !== "playing"} />
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<Abjad />);
</script>
</body>
</html>
